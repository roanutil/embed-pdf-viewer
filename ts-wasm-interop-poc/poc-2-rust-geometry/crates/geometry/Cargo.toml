[package]
name = "poc-geometry"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to the installed wasm-bindgen CLI. A mismatch between the crate and
# the CLI is the single most common wasm-bindgen build failure, so this is an
# exact-version pin on purpose.
wasm-bindgen = "=0.2.127"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[dev-dependencies]
serde_json = "1"
