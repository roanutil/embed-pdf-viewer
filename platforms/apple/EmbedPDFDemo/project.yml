name: EmbedPDFDemo
options:
  bundleIdPrefix: com.embedpdf
  deploymentTarget:
    iOS: "17.0"
packages:
  EmbedPDF:
    path: ../EmbedPDF
targets:
  EmbedPDFDemo:
    type: application
    platform: iOS
    sources:
      - path: EmbedPDFDemo
      # XcodeGen silently drops a target-level `resources:` list; nesting the
      # files under `sources` with `buildPhase: resources` is what copies them
      # (see pdfium-multiplatform-prototype/apps/ios/project.yml).
      - path: ../../../pdfium-multiplatform-prototype/fixtures/report.pdf
        buildPhase: resources
      - path: ../../../pdfium-multiplatform-prototype/fixtures/encrypted-hello.pdf
        buildPhase: resources
    dependencies:
      - package: EmbedPDF
        product: EmbedPDF
      - package: EmbedPDF
        product: EmbedPDFUI
    info:
      path: EmbedPDFDemo/Info.plist
      properties:
        CFBundleDisplayName: EmbedPDF Demo
        CFBundleShortVersionString: 0.0.0
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.embedpdf.demo
        SWIFT_VERSION: "6.0"
        # No Apple developer team is configured. Ad-hoc signing is enough for
        # the simulator; a device run needs a team set here.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
