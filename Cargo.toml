[workspace]
resolver = "2"
# The crate split is fixed by multiplatform-plan.md ("The crates follow
# the prototype's split, keeping only what survives it").
#
# Building any of this needs the fork's prebuilt artifacts for the host, which
# the runtime package fetches:
#
#   bash packages/engine/runtime/scripts/fetch-libpdfium.sh darwin-arm64
#
# See crates/build-support for the target spelling and the override.
members = [
  "crates/build-support",
  "crates/pdfium-sys",
  "crates/pdfium",
  "crates/epdf-engine",
  "crates/epdf-uniffi",
  "crates/epdf-ffi",
  "crates/epdf-viewer-host",
  # Experimental, never shipped: Task 11's hand-written C bridge.
  "crates/epdf-manual-bridge",
  "crates/epdf-wasm",
  "crates/epdf-web",
  "crates/epdf-node",
  "crates/test-support",
  "crates/uniffi-bindgen",
  # The plugin layer (multiplatform-plugins-plan.md). None of these link
  # PDFium: the plugins' engine is the engine-core contract, and the
  # conformance harness answers it from a table.
  "crates/epdf-kernel",
  "crates/plugin-conformance",
  # One crate per ported package: core libraries as `crates/plugins/<name>`
  # (epdf-geometry, ...), plugins as `crates/plugins/<id>` (epdf-plugin-<id>).
  # A glob so parallel ports never edit this list.
  "crates/plugins/*",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

# Pins still to be taken, as each host crate gets its first export:
#   uniffi       = "=0.32.0"   (epdf-uniffi, uniffi-bindgen)
#   napi         = "=3.12.2"   (epdf-node, default-features = false, "napi8")
#   napi-derive  = "=3.6.3"    (epdf-node)
#   napi-build   = "=2.4.1"    (epdf-node, build-dependencies)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Deliberately NOT panic = "abort", unlike pdfium-binding-benchmarks/Cargo.toml.
# epdf-engine's dispatch wraps every PDFium call in catch_unwind and reports a
# panic as a poisoned session, and panic = "abort" would remove that path.
# Neither host layer catches panics for us: uniffi wraps calls in catch_unwind,
# but napi-derive only does so for functions marked #[napi(catch_unwind)], so
# epdf-node's exports must return Result rather than panic.
