name: Engine Rust core

# The Rust half of the multiplatform port (multiplatform-plan.md). Two things
# have to hold together for the port to mean anything:
#
#   1. The Rust crates build, and every reader reproduces the frozen
#      conformance vectors under tooling/engine-conformance/vectors/.
#   2. Those vectors still describe what the shipping TypeScript engine
#      produces.
#
# They are separate jobs because they need different things. The first needs a
# native libembedpdf and no JavaScript; the second needs the WASM runtime
# payload and no Rust. A green first job with a stale corpus proves only that
# Rust still agrees with a snapshot of the past, which is why the second job
# is not optional.

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tooling/engine-conformance/**'
      - 'packages/engine/**'
      - '.github/workflows/engine-rust.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tooling/engine-conformance/**'
      - 'packages/engine/**'
      - '.github/workflows/engine-rust.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: engine-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  cargo:
    name: cargo test + corpus replay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The fork target whose prebuilt libembedpdf the host build links.
      FORK_TARGET: linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # rust-toolchain.toml pins the channel and every cross-compilation
      # target. This job only builds for the host; the mobile and WASM targets
      # belong to the distribution workflow.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Fetch the fork's prebuilt libembedpdf
        run: bash packages/engine/runtime/scripts/fetch-libpdfium.sh "$FORK_TARGET"

      # No `cargo fmt --check` yet: the crates predate rustfmt.toml and twelve
      # of them still differ from it. Normalizing them is a separate change
      # from the port, and doing it inside a port commit buries the port.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Also regenerates the ts-rs bindings, which is why the dirty-diff check
      # comes straight after it. Rust is canonical for the wire DTOs; a
      # generated .ts that nobody regenerated is a second definition.
      - name: cargo test
        run: cargo test --workspace

      - name: Generated TypeScript DTOs are current
        run: git diff --exit-code -- packages/engine/core/src/dto/generated

  vectors:
    name: corpus and matrix are current
    needs: build-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download engine-runtime artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: engine-runtime-*
          path: packages/engine/runtime/_artifacts

      - name: Stage runtime payloads
        shell: bash
        run: |
          shopt -s nullglob
          for dir in packages/engine/runtime/_artifacts/engine-runtime-*; do
            target="${dir##*/engine-runtime-}"
            mkdir -p "packages/engine/runtime/npm/$target"
            cp -R "$dir/." "packages/engine/runtime/npm/$target/"
          done
          rm -rf packages/engine/runtime/_artifacts

      # Regenerates every vector from the shipping engine and fails on any
      # difference, including a fixture the generator can no longer reproduce.
      - name: Fixtures are reproducible
        run: |
          node tooling/engine-conformance/fixtures/generate.mjs
          git diff --exit-code -- tooling/engine-conformance/fixtures

      - name: Vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run vectors:check

      # The zod schemas stay handwritten while the Rust types are canonical.
      # This is what holds the two together: zod's verdict on each case is
      # recorded here, and crates/epdf-engine/tests/schema_parity.rs replays it.
      - name: Schema parity vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run schema:check

      # G5's entry gate: what validateSearchRegex, matchRegex and foldText
      # produce, replayed by crates/epdf-engine/tests/search_dialect.rs.
      - name: Search dialect vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run search:check

      # G3's gate. auth/scope is a deliberate duplicate rather than a port,
      # so this is the only thing keeping the two copies the same rule.
      # Changing either side without the other is a permission difference
      # between web and native, which neither side's unit tests would notice.
      - name: Scope vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run scope:check

      # G3, the derivation half: probe shapes, the 0xFFFFFFFC all-allowed
      # convention, the permission advisory and the wire state.
      - name: Security state vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run security:check

      # G4: the arithmetic that turns a PDF region into a device raster,
      # before any pixel exists. A matrix that is subtly wrong makes a picture
      # that is subtly wrong, which nobody catches by looking.
      - name: Render geometry vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run render:check

      # G5's entry gate: the two text index spaces and the map between
      # them. core/src/text/charmap.ts stays in TypeScript for the web
      # selection plugins, so this is what keeps the duplicate honest.
      - name: Charmap vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run charmap:check

      # G5's literal and snippet halves, and G6's metadata read. Both are
      # document-level rather than per-page, so they have generators of
      # their own rather than rows in the per-page corpus.
      - name: Metadata vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run metadata:check

      # G6: ISO 32000-2 Table 240, where a bit at the wrong position sends
      # a form submission to the wrong place in the wrong format and nothing
      # downstream can tell.
      - name: Action vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run actions:check

      # G5's shared layout contract. layout.ts stays in TypeScript for the
      # web selection plugins, so this file is what a native port will be
      # written against rather than written from prose.
      - name: Layout vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run layout:check

      # G7's pure half: every annotation enum, swept past both ends. A line
      # ending one code off still draws an arrow and a blend mode one code off
      # still composites, so nothing downstream notices either.
      - name: Annotation vocabulary vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run annotation:check

      # G7's reads. The base shell every annotation carries, recorded as the
      # whole DTO so the vector does not move every time a subtype reader
      # lands.
      - name: Annotation read vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run annotation-read:check

      # G7's appearances. Placement rather than pixels: the two engines
      # rasterize through different PDFium builds, so a digest would compare
      # rasterizers. Where an appearance is placed is where the rule lives.
      - name: Annotation appearance vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run annotation-appearance:check

      # G8's reads. The embedded-file tree and what each entry decodes to,
      # bytes included: a deflate stream has one correct decoding, so unlike
      # a raster there is nothing build-specific in the path.
      - name: Attachment vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run attachments:check

      # G8's forms. The reconciled field tree, which is also what closes G7's
      # widget-to-field join: a widget's /Parent names a field dictionary and
      # only this model can follow it.
      - name: Form vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run forms:check

      # G12's value writes. The changed-widget list is the half a field
      # comparison misses: one write can change two widgets, or none.
      - name: Form write vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run form-write:check

      # G12's structural writes: creating a field, its widgets, and the
      # joins between them.
      - name: Form field vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run form-field:check

      # G13's page list: what a reorder, a rotation and a delete leave.
      - name: Page mutate vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run pages-mutate:check

      # G13's destructive half: what applying a redaction takes with it.
      - name: Redaction vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run redaction:check

      # G14's metadata writes: the three-state patch over /Info.
      - name: Metadata write vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run metadata-write:check

      # G8's /PieceInfo, on both holders. The catalog and page accessor
      # families differ only by a page object number, so a branch written the
      # wrong way round reads one while claiming the other.
      - name: Piece-info vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run piece-info:check

      # G9. Semantic rather than byte-for-byte: two runs of one PDF serializer
      # differ in object numbering and file identifier, so the extracted bytes
      # are reopened and asked what document they are.
      - name: Extract vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run extract:check

      # G10's save, semantic like the extract and for the same reason. Both
      # modes, because an incremental save appends a revision and a full save
      # rewrites the file, and the two have to mean the same thing.
      - name: Save vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run save:check

      # G11's two pure decisions, pinned before the mutators that use them.
      # A wrong appearance verdict destroys a stream that cannot be
      # recomputed; a wrong impact verdict lets a client dereference an index
      # that now points somewhere else.
      - name: Annotation write vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run annotation-write:check

      # G11's first mutator. The comparison is the read-back DTO, so it is
      # between two documents rather than between two descriptions of an
      # intent.
      - name: Annotation create vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run annotation-create:check

      # The delete half. The comparison includes every surviving
      # annotation's /NM in order, which is what catches a delete that
      # removed the wrong entry: the reported id would still look right.
      - name: Annotation delete vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run annotation-delete:check

      # The update half, which also carries the appearance verdict: a
      # preserved stream and a re-baked one leave the same dictionary and
      # different documents.
      - name: Annotation update vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run annotation-update:check

      # The move half. A move is about order, so the comparison is the
      # resulting order by /NM rather than the annotations themselves.
      - name: Annotation move vectors are current
        run: pnpm --filter @embedpdf/tooling-engine-conformance run annotation-move:check

      # multiplatform-port-order.md Section 6: a kind added to
      # worker-protocol.ts without a row in the matrix fails here, and so does
      # a row for a kind that no longer exists.
      - name: Operation matrix covers every worker kind
        run: pnpm --filter @embedpdf/tooling-engine-conformance run operations:check

  build-runtime:
    uses: ./.github/workflows/build-engine-runtime.yml
    secrets: inherit
