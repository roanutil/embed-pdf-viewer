[package]
name = "epdf-uniffi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "epdf_uniffi"
# cdylib for `uniffi-bindgen generate --library` and for JNA on the JVM;
# staticlib for the iOS device and simulator slices.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
epdf-engine = { path = "../epdf-engine" }
pdfium = { path = "../pdfium" }
serde_json = "1"
uniffi = "=0.32.0"
thiserror = "2"

[build-dependencies]
build-support = { path = "../build-support" }

[dev-dependencies]
serde_json = "1"
test-support = { path = "../test-support" }
