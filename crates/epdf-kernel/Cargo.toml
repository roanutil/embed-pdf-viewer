[package]
name = "epdf-kernel"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "packages/core/main in Rust: the viewer kernel, its store, plugin plan, scopes and document lifecycle, on a single-threaded runtime with an injected clock."

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
# `float_roundtrip` because the vectors are compared value for value, and the
# default parser is not correctly rounded (crates/test-support/src/lib.rs).
# `preserve_order` because a JS object keeps its members in insertion order,
# and the state tree is printed that way.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
# The document registry and the slice map keep insertion order, as the
# TypeScript's objects do.
indexmap = { version = "2", features = ["serde"] }
base64 = "0.22"
