[package]
name = "epdf-viewer-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "epdf_viewer_host"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Experimental, never shipped: links Task 11's hand-written C bridge
# (`crates/epdf-manual-bridge`) into this staticlib, registers each host's
# kernel thread with it, and adds the uniffi exports its benchmarks time
# (`experimental_kernel_token`, `bench_noop_hop`). Only
# `build-xcframework.sh --experimental-manual-bridge` turns it on.
manual-bridge = ["dep:epdf-manual-bridge"]

[dependencies]
epdf-engine = { path = "../epdf-engine" }
epdf-ffi = { path = "../epdf-ffi" }
epdf-kernel = { path = "../epdf-kernel" }
epdf-manual-bridge = { path = "../epdf-manual-bridge", optional = true }
epdf-plugin-actions = { path = "../plugins/actions", default-features = false, features = ["uniffi"] }
epdf-plugin-commands = { path = "../plugins/commands", default-features = false, features = ["uniffi"] }
epdf-plugin-i18n = { path = "../plugins/i18n", default-features = false, features = ["uniffi"] }
epdf-plugin-interaction = { path = "../plugins/interaction", default-features = false, features = ["uniffi"] }
epdf-plugin-metadata = { path = "../plugins/metadata", default-features = false, features = ["uniffi"] }
epdf-plugin-page-edit = { path = "../plugins/page-edit", default-features = false, features = ["uniffi"] }
epdf-plugin-render = { path = "../plugins/render", default-features = false, features = ["uniffi"] }
epdf-plugin-search = { path = "../plugins/search", default-features = false, features = ["uniffi"] }
epdf-plugin-selection = { path = "../plugins/selection", default-features = false, features = ["uniffi"] }
epdf-plugin-shell = { path = "../plugins/shell", default-features = false, features = ["uniffi"] }
epdf-plugin-view-manager = { path = "../plugins/view-manager", default-features = false, features = ["uniffi"] }
epdf-uniffi = { path = "../epdf-uniffi" }
base64 = "0.22"
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = "=0.32.0"

[build-dependencies]
build-support = { path = "../build-support" }

[dev-dependencies]
test-support = { path = "../test-support" }

# The manual bridge's C ABI, driving a real host. Here rather than in
# `epdf-manual-bridge` so that no dev-dependency turns `manual-bridge` on
# under `cargo test --workspace`: the workspace build is the shipping one.
[[test]]
name = "manual_bridge_abi"
required-features = ["manual-bridge"]
