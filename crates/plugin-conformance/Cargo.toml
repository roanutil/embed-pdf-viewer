[package]
name = "plugin-conformance"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Replays tooling/plugin-conformance/vectors against the Rust kernel and plugins: the scenario runner, the fake engine, the probe plugin and canonical comparison."

[lib]
crate-type = ["rlib"]

[dependencies]
epdf-kernel = { path = "../epdf-kernel" }
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a vector's arguments are parsed in document order, which
# is the order JavaScript iterated them in. Without it an object argument
# arrives sorted, and a function whose result depends on `Object.entries`
# order (a list of problems, the first error thrown) cannot be replayed.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
base64 = "0.22"

# Text-layout hydration runs the native engine's geometry. epdf-web builds this
# crate for wasm32, where pdfium-sys has no target, so the engine stays native.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
epdf-engine = { path = "../epdf-engine" }

[build-dependencies]
build-support = { path = "../build-support" }
