[package]
name = "epdf-ui-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "packages/core/ui in Rust: the bar schema, the toolbar fit solver, the overflow projection, the viewer layout with its edits and validation, and the shortcut parser."

[lib]
crate-type = ["rlib"]

[features]
# The conformance adapter (`harness` module). On by default so `cargo test`
# replays the vectors with no flags; a host that ships the crate turns it
# off with `default-features = false`.
default = ["harness"]
harness = ["dep:plugin-conformance"]

[dependencies]
epdf-kernel = { path = "../../epdf-kernel" }
serde = { version = "1", features = ["derive"] }
# `preserve_order`: objects keep the order they arrived in, as JS objects do,
# whatever else is linked (the harness turned it on only in its builds).
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
plugin-conformance = { path = "../../plugin-conformance", optional = true }

[build-dependencies]
build-support = { path = "../../build-support" }
