[package]
name = "epdf-plugin-i18n"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "packages/plugin/i18n in Rust: workspace-scoped locale packs in the store, pure translation, BCP-47 negotiation and CLDR plural selection."

[lib]
crate-type = ["rlib"]

[features]
# The conformance adapter (`harness` module). On by default so `cargo test`
# replays the vectors with no flags; a host that ships the plugin turns it
# off with `default-features = false`.
default = ["harness"]
harness = ["dep:plugin-conformance"]

[dependencies]
epdf-kernel = { path = "../../epdf-kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
plugin-conformance = { path = "../../plugin-conformance", optional = true }
