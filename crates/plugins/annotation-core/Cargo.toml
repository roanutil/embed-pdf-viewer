[package]
name = "epdf-annotation-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "packages/core/annotation in Rust: the pure annotation model (kinds, props, update, geometry, cloudy borders, hit testing, scene and view)."

[lib]
crate-type = ["rlib"]

[features]
# The conformance adapter (`harness` module). On by default so `cargo test`
# replays the vectors with no flags; a host that ships the library turns it
# off with `default-features = false`.
default = ["harness"]
harness = ["dep:plugin-conformance", "dep:epdf-kernel"]

[dependencies]
epdf-geometry = { path = "../geometry", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
# `Model.defaults` keeps the order tools were configured in, as the
# TypeScript object does.
indexmap = { version = "2", features = ["serde"] }
# `Annot.data` carries the engine DTO verbatim, and a props patch keeps keys
# it does not know; both are JSON values. `preserve_order` keeps a patch's
# keys in the order they arrived, which the `props` patch effect reports.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
epdf-kernel = { path = "../../epdf-kernel", optional = true }
plugin-conformance = { path = "../../plugin-conformance", optional = true }
