[package]
name = "epdf-plugin-actions"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "packages/plugin/actions in Rust: the PDF action engine (one serialized dispatcher for /A and /AA trees, origin policy, executor and sink registry, the lifecycle coordinator, and JavaScript over a host-supplied sandbox)."

[lib]
crate-type = ["rlib"]

[features]
# The conformance adapter (`harness` module). On by default so `cargo test`
# replays the vectors with no flags; a host that ships the plugin turns it
# off with `default-features = false`.
default = ["harness"]
harness = ["dep:plugin-conformance", "epdf-acrojs/harness"]

[dependencies]
epdf-acrojs = { path = "../acrojs", default-features = false }
epdf-kernel = { path = "../../epdf-kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
plugin-conformance = { path = "../../plugin-conformance", optional = true }
