[package]
name = "epdf-plugin-redaction"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "packages/plugin/redaction in Rust: marking as redact annotations (from the selection, an area, a page or search matches), the pending view, the collateral estimate, labels, and the destructive doc.redaction.apply stage with remote applies and the canMark / canApply twins."

[lib]
crate-type = ["rlib"]

[features]
# The conformance adapter (`harness` module). On by default so `cargo test`
# replays the vectors with no flags; a host that ships the plugin turns it
# off with `default-features = false`.
default = ["harness"]
harness = [
  "dep:plugin-conformance",
  "dep:epdf-plugin-interaction",
  "epdf-plugin-annotation/harness",
  "epdf-plugin-interaction/harness",
  "epdf-plugin-search/harness",
  "epdf-plugin-selection/harness",
]
# The uniffi exports (`ffi` module), for `epdf-viewer-host`. `mark_matches`
# takes search's `SearchQuery` record, so search's exports come along.
uniffi = ["dep:uniffi", "dep:epdf-ffi", "epdf-plugin-search/uniffi"]

[dependencies]
epdf-kernel = { path = "../../epdf-kernel" }
epdf-geometry = { path = "../geometry", default-features = false }
epdf-annotation-core = { path = "../annotation-core", default-features = false }
epdf-plugin-annotation = { path = "../annotation", default-features = false }
epdf-plugin-search = { path = "../search", default-features = false }
epdf-plugin-selection = { path = "../selection", default-features = false }
# The harness's `redaction-tool` lens arms the redact tool through the hub.
epdf-plugin-interaction = { path = "../interaction", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
plugin-conformance = { path = "../../plugin-conformance", optional = true }
epdf-ffi = { path = "../../epdf-ffi", optional = true }
uniffi = { version = "=0.32.0", optional = true }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
plugin-conformance = { path = "../../plugin-conformance" }
epdf-plugin-interaction = { path = "../interaction" }

[[test]]
name = "conformance"
required-features = ["harness"]

[[test]]
name = "ffi"
required-features = ["uniffi"]
