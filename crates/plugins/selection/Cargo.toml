[package]
name = "epdf-plugin-selection"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "packages/plugin/selection in Rust: text selection over the engine's text geometry, its pointer handler, handles, copy, and the select/copy permission twins."

[lib]
crate-type = ["rlib"]

[features]
# The conformance adapter (`harness` module). On by default so `cargo test`
# replays the vectors with no flags; a host that ships the plugin turns it
# off with `default-features = false`.
default = ["harness"]
harness = ["dep:plugin-conformance", "epdf-plugin-interaction/harness"]
# The uniffi exports (`ffi` module), for `epdf-viewer-host`.
uniffi = ["dep:uniffi", "dep:epdf-ffi"]

[dependencies]
epdf-kernel = { path = "../../epdf-kernel" }
epdf-geometry = { path = "../geometry", default-features = false }
epdf-plugin-interaction = { path = "../interaction", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
plugin-conformance = { path = "../../plugin-conformance", optional = true }
epdf-ffi = { path = "../../epdf-ffi", optional = true }
uniffi = { version = "=0.32.0", optional = true }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
plugin-conformance = { path = "../../plugin-conformance" }

# The cross-check of this crate's text layout against the engine's
# (`tests/engine_cross_check.rs`, Ruling13.15). Native only: epdf-engine
# links PDFium, which wasm32 does not have, and a dev-dependency never
# reaches a dependent's build graph.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
epdf-engine = { path = "../../epdf-engine" }

[build-dependencies]
build-support = { path = "../../build-support" }
