[package]
name = "epdf-text-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "packages/core/text in Rust: text laid out as the engine lays it out, the font each character is drawn in, the Unicode bidirectional order, and a form field's lines, sizes and runs."

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
epdf-fonts = { path = "../fonts", default-features = false }
epdf-geometry = { path = "../geometry", default-features = false }
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data"] }
unicode-bidi-mirroring = "0.4"
unicode-properties = { version = "0.1.3", default-features = false, features = ["general-category"] }
unicode-script = "0.5.7"
