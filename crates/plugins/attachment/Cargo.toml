[package]
name = "epdf-plugin-attachment"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "packages/plugin/attachment in Rust: the files a document carries, its attachments as a lazy kernel mirror with this session's pending adds and removes shown and its file attachment annotations, as one list; the selection, adding and removing attachments as undoable changes, downloading any file, and going to a page's file."

[lib]
crate-type = ["rlib"]

[features]
# The conformance adapter (`harness` module). On by default so `cargo test`
# replays the vectors with no flags; a host that ships the plugin turns it
# off with `default-features = false`.
default = ["harness"]
harness = [
  "dep:plugin-conformance",
  "epdf-plugin-annotation/harness",
  "epdf-plugin-stage/harness",
]

[dependencies]
epdf-kernel = { path = "../../epdf-kernel" }
# A page's file is a file attachment annotation's (`annotationKey`).
epdf-annotation-core = { path = "../annotation-core", default-features = false }
epdf-geometry = { path = "../geometry", default-features = false }
# The optional plugins `attachment.plugin.ts` lists. Neither is required at
# run time; their tokens and capability types are what the controller looks
# up.
epdf-plugin-annotation = { path = "../annotation", default-features = false }
epdf-plugin-stage = { path = "../stage", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
plugin-conformance = { path = "../../plugin-conformance", optional = true }

[dev-dependencies]
epdf-plugin-history = { path = "../history" }
epdf-plugin-interaction = { path = "../interaction" }
plugin-conformance = { path = "../../plugin-conformance" }

[build-dependencies]
build-support = { path = "../../build-support" }

[[test]]
name = "conformance"
required-features = ["harness"]

[[test]]
name = "behavior"
required-features = ["harness"]
