[package]
name = "epdf-plugin-search"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "packages/plugin/search in Rust: document text search over the engine's budgeted, cursor-resumable slices, with the Stage for viewport-first scanning and reveal-on-navigate."

[lib]
crate-type = ["rlib"]

[features]
# The conformance adapter (`harness` module). On by default so `cargo test`
# replays the vectors with no flags; a host that ships the plugin turns it
# off with `default-features = false`.
default = ["harness"]
harness = ["dep:plugin-conformance", "epdf-plugin-stage/harness"]

[dependencies]
epdf-kernel = { path = "../../epdf-kernel" }
epdf-geometry = { path = "../geometry", default-features = false }
epdf-plugin-stage = { path = "../stage", default-features = false }
# For `page_ref_json`, the `PageRef` serde adapter the plugin crates share.
epdf-plugin-actions = { path = "../actions", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
plugin-conformance = { path = "../../plugin-conformance", optional = true }

[[test]]
name = "conformance"
required-features = ["harness"]
