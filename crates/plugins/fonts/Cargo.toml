[package]
name = "epdf-fonts"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "packages/core/fonts in Rust: the 14 standard PDF fonts as PDFium draws them, their layout metrics and OpenType programs."

[lib]
crate-type = ["rlib"]

[features]
# The conformance adapter (`harness` module). On by default so `cargo test`
# replays the vectors with no flags; a host that ships the library turns it
# off with `default-features = false`.
default = ["harness"]
harness = ["dep:plugin-conformance", "dep:epdf-kernel", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"] }
epdf-kernel = { path = "../../epdf-kernel", optional = true }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }
plugin-conformance = { path = "../../plugin-conformance", optional = true }

[build-dependencies]
build-support = { path = "../../build-support" }

[dev-dependencies]
serde_json = "1"
