[package]
name = "epdf-plugin-annotation"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "packages/plugin/annotation in Rust: the pure annotation core wired to the engine (a records mirror, and changes shown at once until their writes settle) and to the interaction hub (ambient editing and the draw tools), plus comments, attached links, stamps, text markup and the hover feed."

[lib]
crate-type = ["rlib"]

[features]
# The conformance adapter (`harness` module). On by default so `cargo test`
# replays the vectors with no flags; a host that ships the plugin turns it
# off with `default-features = false`.
default = ["harness"]
harness = [
  "dep:plugin-conformance",
  "epdf-plugin-interaction/harness",
  "epdf-plugin-selection/harness",
  "epdf-plugin-actions/harness",
  "epdf-plugin-render/harness",
]
# The uniffi exports (`ffi` module), for `epdf-viewer-host`.
uniffi = ["dep:uniffi", "dep:epdf-ffi", "dep:async-trait", "dep:futures"]

[dependencies]
epdf-kernel = { path = "../../epdf-kernel" }
epdf-geometry = { path = "../geometry", default-features = false }
epdf-annotation-core = { path = "../annotation-core", default-features = false }
epdf-acrojs = { path = "../acrojs", default-features = false }
epdf-plugin-interaction = { path = "../interaction", default-features = false }
epdf-plugin-selection = { path = "../selection", default-features = false }
epdf-plugin-actions = { path = "../actions", default-features = false }
epdf-plugin-render = { path = "../render", default-features = false }
indexmap = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
plugin-conformance = { path = "../../plugin-conformance", optional = true }
epdf-ffi = { path = "../../epdf-ffi", optional = true }
uniffi = { version = "=0.32.0", optional = true }
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", default-features = false, features = ["std", "executor"], optional = true }

[build-dependencies]
build-support = { path = "../../build-support" }

[dev-dependencies]
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
plugin-conformance = { path = "../../plugin-conformance" }

[[test]]
name = "conformance"
required-features = ["harness"]

[[test]]
name = "behavior"
required-features = ["harness"]

[[test]]
name = "ffi"
required-features = ["uniffi"]
