[package]
name = "epdf-plugin-stamp"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "packages/plugin/stamp in Rust: workspace stamp libraries (canonical PieceInfo-backed PDFs and loose assets) over an asset engine, dynamic stamps evaluated through form scripting, and placement through the annotation plugin."

[lib]
crate-type = ["rlib"]

[features]
# The conformance adapter (`harness` module). On by default so `cargo test`
# replays the vectors with no flags; a host that ships the plugin turns it
# off with `default-features = false`.
default = ["harness"]
harness = [
  "dep:plugin-conformance",
  "epdf-acrojs/harness",
  "epdf-plugin-interaction/harness",
  "epdf-plugin-annotation/harness",
  "epdf-plugin-form/harness",
]

[dependencies]
epdf-kernel = { path = "../../epdf-kernel" }
epdf-geometry = { path = "../geometry", default-features = false }
epdf-acrojs = { path = "../acrojs", default-features = false }
epdf-plugin-interaction = { path = "../interaction", default-features = false }
epdf-plugin-annotation = { path = "../annotation", default-features = false }
epdf-plugin-form = { path = "../form", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
plugin-conformance = { path = "../../plugin-conformance", optional = true }

[[test]]
name = "conformance"
required-features = ["harness"]
