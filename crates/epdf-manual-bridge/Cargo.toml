[package]
name = "epdf-manual-bridge"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Experimental: a hand-written C ABI for the search plugin and render_page, timed against uniffi by Task 11. Never shipped."

# An rlib only. `epdf-viewer-host` links it into its own staticlib with the
# `manual-bridge` feature, so the C exports share one copy of the kernel
# thread's statics with the uniffi exports. A second staticlib merged in
# beside it would carry its own copy of every dependency.
[lib]
crate-type = ["rlib"]

[dependencies]
epdf-ffi = { path = "../epdf-ffi" }
epdf-kernel = { path = "../epdf-kernel" }
epdf-plugin-render = { path = "../plugins/render", default-features = false, features = ["uniffi"] }
epdf-plugin-search = { path = "../plugins/search", default-features = false, features = ["uniffi"] }

[dev-dependencies]
# A dev-dependency cycle: the host links this crate with `manual-bridge`, and
# the ABI tests drive a real host. Integration tests link one copy of both.
epdf-viewer-host = { path = "../epdf-viewer-host", features = ["manual-bridge"] }
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
test-support = { path = "../test-support" }

[build-dependencies]
# The rpath to libembedpdf for the ABI tests, which drive a real host.
build-support = { path = "../build-support" }
