[package]
name = "epdf-capi"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Checked native C ABI for the Rust engine and its pure geometry helpers."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
epdf-engine = { path = "../epdf-engine" }
epdf-geometry = { path = "../plugins/geometry", default-features = false }
serde = { version = "1", features = ["derive"] }
# Exact decimal-to-double decoding: arguments carry unrounded geometry.
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
test-support = { path = "../test-support" }

[build-dependencies]
build-support = { path = "../build-support" }
