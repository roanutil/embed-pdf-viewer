[package]
name = "epdf-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
pdfium = { path = "../pdfium" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
# TypeScript generation for the wire DTOs. Rust is canonical; the emitted .ts
# is checked in and CI fails on a dirty diff (multiplatform-plan.md, G1).
ts-rs = "=12.0.1"
# G5's engines, both of them, for the reasons in features/search.rs:
# `regress` parses ECMAScript syntax, which is what the dialect validator
# needs; `regex` executes in linear time, which is what an untrusted pattern
# from a search box needs. Neither does both.
regress = "=0.12.0"
regex = "=1.13.1"
# G5's fold is NFKD, which is a 30,000-entry table nobody should transcribe.
# `unicode-normalization` is the crate `regex` and `idna` already build on, so
# it is not a new supply-chain surface so much as an explicit one.
unicode-normalization = "=0.1.24"

[build-dependencies]
build-support = { path = "../build-support" }

[dev-dependencies]
test-support = { path = "../test-support" }
# The Stage B spike's write test calls PDFium through the leased raw pointer,
# which is what the host does with it. Goes with the spike.
pdfium-sys = { path = "../pdfium-sys" }
# Signing tests build their CMS with the plugin's own builder.
epdf-signature-core = { path = "../plugins/signature-core" }
