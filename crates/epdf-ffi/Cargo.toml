[package]
name = "epdf-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# `bench_noop`, the uniffi control entry point Task 11's bridge benchmarks
# time. Off by default: only `build-xcframework.sh --experimental-manual-bridge`
# turns it on, and the shipping package never sees it.
bench = []

[dependencies]
epdf-geometry = { path = "../plugins/geometry", default-features = false }
epdf-kernel = { path = "../epdf-kernel" }
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
thiserror = "2"
uniffi = "=0.32.0"

[[test]]
name = "bench"
required-features = ["bench"]
