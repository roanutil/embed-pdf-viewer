[package]
name = "epdf-crux"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "epdf_crux"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "codegen"
required-features = ["codegen"]

[features]
facet_typegen = ["crux_core/facet_typegen"]
codegen = ["facet_typegen"]

[dependencies]
crux_core = "=0.20.0"
epdf-engine = { path = "../epdf-engine" }
facet = "*"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = "=0.32.0"

[build-dependencies]
build-support = { path = "../build-support" }

[dev-dependencies]
crux_core = { version = "=0.20.0", features = ["testing"] }
test-support = { path = "../test-support" }
