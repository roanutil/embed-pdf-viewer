android.useAndroidX=true

# AGP 9.0 enables its own bundled ("built-in") Kotlin support by default, at
# whatever Kotlin/KGP version AGP itself pins. This scaffold pins Kotlin
# 2.2.20 everywhere else (packages/kotlin/epdf-ops/build.gradle.kts, the
# generated bindings' target ABI), so app/build.gradle.kts applies
# org.jetbrains.kotlin.android explicitly at that same version instead of
# taking whatever AGP bundles. Built-in Kotlin requires the new module DSL,
# and the classic kotlin-android plugin is not compatible with that DSL, so
# both flags are needed together; see
# https://developer.android.com/build/migrate-to-built-in-kotlin.
android.builtInKotlin=false
android.newDsl=false
